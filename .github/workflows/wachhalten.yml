name: Supabase wachhalten

# Kostenlose Supabase-Projekte pausieren nach etwa 7 Tagen ohne Nutzung.
# Bis zur Auslosung nutzt kaum jemand die App, deshalb fragt diese Action
# jeden Tag einmal die öffentliche Rundentabelle ab (keine persönlichen Daten).
# Nach Ende Januar 2027 hört sie von selbst auf (dann wird das Projekt gelöscht).

on:
  schedule:
    - cron: '17 6 * * *'   # täglich 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank kurz abfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20270131 ]; then
            echo "Nach der WM nicht mehr nötig."; exit 0
          fi
          code=$(curl -sS -o antwort.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/rounds?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code: $(cat antwort.json)"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase antwortet nicht (HTTP $code). Ist das Projekt pausiert? Im Supabase-Dashboard auf 'Resume project' klicken."
            exit 1
          fi
